<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}测试用例平台{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-wrapper">
    <!-- 左侧菜单 -->
    <aside class="sidebar">
        <div class="brand">测试用例平台</div>
        <nav>
            <a href="{{ url_for('doc_list') }}"
               class="nav-item {% if request.endpoint in ('doc_list', 'index') %}active{% endif %}">
                📁 需求文档
            </a>
            <a href="{{ url_for('case_list') }}"
               class="nav-item {% if request.endpoint == 'case_list' and not request.args.get('doc_name') %}active{% endif %}">
                📋 用例管理
            </a>
            <a href="{{ url_for('test_point_list_page') }}" class="nav-item {% if request.endpoint == 'test_point_list_page' %}active{% endif %}">
        📝 测试点评审
            </a>
            <a href="{{ url_for('expert_list') }}" class="nav-item {% if 'expert' in request.endpoint %}active{% endif %}">
                👨‍💻 专家团队
            </a>
        </nav>
    </aside>

    <!-- 右侧内容 -->
    <main class="content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="alert alert-{{ cat }} alert-dismissible fade show">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
